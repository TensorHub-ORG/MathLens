[project]
name = "mathlens-mineru-runtime"
version = "0.1.0"
description = "Isolated MinerU runtime for the MathLens MinerU adapter."
requires-python = ">=3.11,<3.13"
dependencies = [
  "mineru[pipeline]==3.4.5",
  # MinerU 3.4.5 imports six in its pipeline OCR path but does not declare it.
  "six>=1.17,<2",
  # Pin an official CUDA 12.8 pair; uv selects the CUDA wheels below on Windows.
  "torch==2.11.0",
  "torchvision==0.26.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = false
cache-dir = ".uv-cache"
link-mode = "copy"
