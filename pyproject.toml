[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mathcraft"
version = "0.1.0"
description = "A verifiable workflow core for mathematical document parsing and reasoning."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Guoren Zhang", email = "2245924824@qq.com" }]
dependencies = [
  "pydantic>=2.8,<3",
  "pymupdf>=1.24,<2",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/TensorHub-ORG/MathCraft"
Documentation = "https://github.com/TensorHub-ORG/MathCraft/tree/main/docs"
Issues = "https://github.com/TensorHub-ORG/MathCraft/issues"

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
mathcraft = "mathcraft.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mathcraft = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mathcraft"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mathcraft"]
